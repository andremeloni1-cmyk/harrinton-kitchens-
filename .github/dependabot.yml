version: 2
updates:
  # Application dependencies (Next.js app lives in /app).
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Batch low-risk updates so review stays manageable.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions used by the CI workflow.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
