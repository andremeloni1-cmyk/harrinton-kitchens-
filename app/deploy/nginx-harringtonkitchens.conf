# nginx reverse proxy for Harrington Kitchens.
# Copy to /etc/nginx/sites-available/harringtonkitchens, replace DOMAIN_PLACEHOLDER,
# symlink into sites-enabled, then run certbot to add TLS (see DEPLOY.md).

# Rate-limit the login endpoint to blunt password brute-forcing (5 req/s/IP,
# small burst). Defined at http scope via this zone.
limit_req_zone $binary_remote_addr zone=hk_login:10m rate=5r/s;

# Rate-limit the other credential/token endpoints — password-reset emails,
# invite-token acceptance, and portal magic-link requests — which the app also
# throttles per IP/email (P2-C1). These are far less frequent than login.
limit_req_zone $binary_remote_addr zone=hk_auth:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_PLACEHOLDER;

    # Don't advertise the nginx version.
    server_tokens off;

    # Allow larger uploads (bulk site photos / PDFs). Photos are shrunk in the
    # browser before upload, so this is generous headroom.
    client_max_body_size 50M;

    # Throttle login attempts (brute-force defence).
    location = /api/auth/login {
        limit_req zone=hk_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:PORT_PLACEHOLDER;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Throttle the reset / invite / portal-login endpoints (token + email abuse).
    location ~ ^/api/(auth/reset|auth/invite|portal/login) {
        limit_req zone=hk_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:PORT_PLACEHOLDER;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:PORT_PLACEHOLDER;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}
