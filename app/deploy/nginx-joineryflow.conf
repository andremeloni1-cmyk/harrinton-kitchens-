# nginx reverse proxy for JoineryFlow.
# Copy to /etc/nginx/sites-available/joineryflow, replace DOMAIN_PLACEHOLDER,
# symlink into sites-enabled, then run certbot to add TLS (see DEPLOY.md).

# Rate-limit the login endpoint to blunt password brute-forcing (5 req/s/IP,
# small burst). Defined at http scope via this zone.
limit_req_zone $binary_remote_addr zone=jf_login:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_PLACEHOLDER;

    # Don't advertise the nginx version.
    server_tokens off;

    # Allow larger uploads (bulk site photos / PDFs). Photos are shrunk in the
    # browser before upload, so this is generous headroom.
    client_max_body_size 50M;

    # Throttle login attempts (brute-force defence).
    location = /api/auth/login {
        limit_req zone=jf_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}
